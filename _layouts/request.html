---
layout: default
---
<div class="site-width">
  <article class="post h-entry prose prose-lg max-w-2xl" itemscope itemtype="http://schema.org/Article">
    <header class="post-header mb-5">
      <div class="post-meta mb-8">
        <time class="dt-published" datetime="{{ page.posted_at | date_to_xmlschema }}" itemprop="datePublished">
          {{ page.posted_at | date: "%-d %B %Y" }}
        </time>
      </div>
      <h1 class="post-title p-name tracking-tight text-2xl text-center" itemprop="name headline">{{ page.title | escape | upcase }}</h1>
    </header>

    <div class="post-content e-content mb-8" itemprop="articleBody">
      {{ content }}
    </div>

    <a class="u-url" href="{{ page.url | relative_url }}" hidden></a>
  </article>
</div>
