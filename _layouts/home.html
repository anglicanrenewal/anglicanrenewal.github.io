layout: default

<div class="home site-width">

    <h1 class="page-heading text-3xl sr-only">{{ page.title }}</h1>
    <div class="mb-0 min-h-0 max-h-64 py-2 flex items-center space-x-6" aria-hidden="true">
      <img src="{{ "/assets/images/atra_logo.png" | relative_url }}" class="max-h-64 w-auto object-contain">
      <img src="{{ "/assets/images/atra_logo-name.svg" | relative_url }}" class="max-h-32 w-auto object-contain">
    </div>
    {{ content }}

    <p class="not-prose mt-10">

        <span class="underline decoration-[#EC762C] decoration-2 underline-offset-[6px] group-hover:decoration-4 transition-all duration-300">Read our latest articles</span>
        <span aria-hidden="true" class="not-italic text-[#EC762C] transition-transform duration-300 motion-safe:group-hover:translate-x-1.5">&rarr;</span>
      </a>
    </p>

    <ul class="not-prose mt-14 flex flex-col sm:flex-row gap-x-10 gap-y-3 text-xl text-(--tw-prose-body)">

        <a href="https://forms.gle/dbpCeLQ96GCvJYkN6" class="rounded-sm font-semibold text-[#5E4B80] hover:text-[#4A3C63] hover:underline underline-offset-4 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#EC762C]">Sign up</a> to receive email updates

      <li>

      </li>
    </ul>
  </div>
